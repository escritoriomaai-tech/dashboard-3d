<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard 3D — Oficina Mecânica</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e1a;
      color: #e0e6ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Header */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10,14,26,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(100,150,255,0.15);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    #header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #7eb8ff;
      letter-spacing: 0.5px;
    }
    #header h1 span { color: #fff; }

    /* Stats bar */
    #stats-bar {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.78rem;
    }
    .stat-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .dot-blue { background: #4a9eff; }
    .dot-yellow { background: #ffc94a; }
    .dot-green { background: #4aff9e; }
    .dot-orange { background: #ff7c4a; }
    .dot-gray { background: #666; }

    #live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #4aff9e;
    }
    .pulse {
      width: 8px; height: 8px;
      background: #4aff9e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* 3D canvas */
    #canvas-container {
      position: fixed;
      top: 56px;
      left: 0; right: 320px; bottom: 0;
    }
    canvas { display: block; }

    /* Info panel */
    #info-panel {
      position: fixed;
      top: 56px; right: 0;
      width: 320px; bottom: 0;
      background: rgba(10,14,26,0.92);
      backdrop-filter: blur(16px);
      border-left: 1px solid rgba(100,150,255,0.15);
      overflow-y: auto;
      padding: 20px;
      transition: transform 0.3s ease;
    }
    #info-panel.hidden { transform: translateX(100%); }

    .panel-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #4a6fa0;
      margin-bottom: 16px;
    }

    /* Order card in panel */
    .order-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(100,150,255,0.12);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .order-card.selected {
      border-color: rgba(100,150,255,0.5);
      background: rgba(74,158,255,0.08);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .order-plate {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }
    .status-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-em_andamento { background: rgba(74,158,255,0.2); color: #4a9eff; border: 1px solid rgba(74,158,255,0.3); }
    .status-aguardando_peca { background: rgba(255,201,74,0.2); color: #ffc94a; border: 1px solid rgba(255,201,74,0.3); }
    .status-concluido { background: rgba(74,255,158,0.2); color: #4aff9e; border: 1px solid rgba(74,255,158,0.3); }
    .status-diagnostico { background: rgba(255,124,74,0.2); color: #ff7c4a; border: 1px solid rgba(255,124,74,0.3); }

    .order-model { font-size: 0.8rem; color: #8899bb; margin-bottom: 4px; }
    .order-service { font-size: 0.85rem; color: #c0d0ee; margin-bottom: 8px; }

    .progress-bar {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      height: 5px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #4a9eff, #7eb8ff);
      transition: width 0.5s ease;
    }

    .order-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #667799;
    }
    .order-value { color: #4aff9e; font-weight: 600; }

    /* Parts list */
    .parts-list { margin-top: 10px; }
    .part-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 0.75rem;
    }
    .part-name { color: #aabbdd; flex: 1; }
    .part-type {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 8px;
      margin-right: 8px;
    }
    .type-troca { background: rgba(74,158,255,0.15); color: #4a9eff; }
    .type-conserto { background: rgba(255,124,74,0.15); color: #ff7c4a; }
    .part-stock {
      font-size: 0.7rem;
      font-weight: 600;
    }
    .stock-ok { color: #4aff9e; }
    .stock-low { color: #ffc94a; }
    .stock-zero { color: #ff4a4a; }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: rgba(10,14,26,0.95);
      border: 1px solid rgba(100,150,255,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      pointer-events: none;
      z-index: 200;
      display: none;
      max-width: 220px;
    }
    #tooltip .tt-plate { font-weight: 700; font-size: 0.95rem; color: #fff; }
    #tooltip .tt-service { font-size: 0.8rem; color: #8899bb; margin-top: 2px; }
    #tooltip .tt-status { font-size: 0.75rem; margin-top: 4px; }

    /* Legend */
    #legend {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 14px;
      background: rgba(10,14,26,0.8);
      border: 1px solid rgba(100,150,255,0.1);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.72rem;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; color: #778899; }
    .legend-color {
      width: 12px; height: 12px;
      border-radius: 2px;
    }

    /* Help hint */
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: #445566;
      pointer-events: none;
    }

    /* Scrollbar */
    #info-panel::-webkit-scrollbar { width: 4px; }
    #info-panel::-webkit-scrollbar-track { background: transparent; }
    #info-panel::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.2); border-radius: 2px; }
  </style>
</head>
<body>

<div id="header">
  <h1>🔧 <span>Oficina</span> Dashboard 3D</h1>
  <div id="stats-bar">
    <div class="stat-pill"><div class="stat-dot dot-blue"></div><span id="stat-em_andamento">0</span> Em andamento</div>
    <div class="stat-pill"><div class="stat-dot dot-yellow"></div><span id="stat-aguardando_peca">0</span> Aguardando</div>
    <div class="stat-pill"><div class="stat-dot dot-green"></div><span id="stat-concluido">0</span> Concluído</div>
    <div class="stat-pill"><div class="stat-dot dot-orange"></div><span id="stat-diagnostico">0</span> Diagnóstico</div>
    <div class="stat-pill"><strong id="stat-revenue" style="color:#4aff9e">R$ 0</strong></div>
  </div>
  <div id="live-indicator"><div class="pulse"></div>AO VIVO</div>
</div>

<div id="canvas-container"></div>

<div id="info-panel">
  <div class="panel-title">Ordens de Serviço</div>
  <div id="orders-list"></div>
</div>

<div id="tooltip">
  <div class="tt-plate" id="tt-plate"></div>
  <div class="tt-service" id="tt-service"></div>
  <div class="tt-status" id="tt-status"></div>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-color" style="background:#4a9eff"></div>Em andamento</div>
  <div class="legend-item"><div class="legend-color" style="background:#ffc94a"></div>Aguardando peça</div>
  <div class="legend-item"><div class="legend-color" style="background:#4aff9e"></div>Concluído</div>
  <div class="legend-item"><div class="legend-color" style="background:#ff7c4a"></div>Diagnóstico</div>
  <div class="legend-item"><div class="legend-color" style="background:#2a3550"></div>Vaga livre</div>
</div>

<div id="hint">Clique num carro para ver detalhes • Arraste para girar • Scroll para zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let carMeshes = {};
let allData = null;
let selectedOrder = null;

const STATUS_COLORS = {
  em_andamento:    0x4a9eff,
  aguardando_peca: 0xffc94a,
  concluido:       0x4aff9e,
  diagnostico:     0xff7c4a,
  vazio:           0x2a3550
};

const STATUS_LABELS = {
  em_andamento:    'Em andamento',
  aguardando_peca: 'Aguardando peça',
  concluido:       'Concluído',
  diagnostico:     'Diagnóstico'
};

// --- Init Three.js ---
function initThree() {
  const container = document.getElementById('canvas-container');
  const W = container.clientWidth;
  const H = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);
  scene.fog = new THREE.FogExp2(0x0a0e1a, 0.025);

  camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.position.set(0, 10, 14);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 5;
  controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI / 2.2;
  controls.target.set(0, 0, 0);

  // Lights
  const ambient = new THREE.AmbientLight(0x1a2a4a, 2.5);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 2.5);
  sun.position.set(5, 12, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.far = 40;
  sun.shadow.camera.left = -15;
  sun.shadow.camera.right = 15;
  sun.shadow.camera.top = 15;
  sun.shadow.camera.bottom = -15;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0x4466aa, 0.8);
  fill.position.set(-5, 5, -5);
  scene.add(fill);

  // Ground
  buildGround();
  buildWorkshop();

  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);

  animate();
}

// --- Ground ---
function buildGround() {
  // Floor
  const floorGeo = new THREE.PlaneGeometry(30, 30);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x111828,
    roughness: 0.9,
    metalness: 0.1
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Grid lines
  const gridHelper = new THREE.GridHelper(30, 30, 0x1a2a44, 0x1a2a44);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  // Slot lanes (painted floor markings)
  for (let i = 0; i < 8; i++) {
    const { x, z } = getSlotPos(i + 1);
    const laneGeo = new THREE.PlaneGeometry(2.4, 5.2);
    const laneMat = new THREE.MeshStandardMaterial({
      color: 0x162035,
      roughness: 1,
      transparent: true,
      opacity: 0.7
    });
    const lane = new THREE.Mesh(laneGeo, laneMat);
    lane.rotation.x = -Math.PI / 2;
    lane.position.set(x, 0.005, z);
    scene.add(lane);

    // Lane border
    const borderGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(2.4, 0.01, 5.2));
    const borderMat = new THREE.LineBasicMaterial({ color: 0x2a4070, linewidth: 1 });
    const border = new THREE.LineSegments(borderGeo, borderMat);
    border.position.set(x, 0.005, z);
    scene.add(border);

    // Slot number
    addSlotNumber(i + 1, x, z);
  }
}

function addSlotNumber(num, x, z) {
  // Fallback: use a small box as placeholder (canvas texture for label)
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, 64, 64);
  ctx.fillStyle = '#2a4070';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num, 32, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(0.8, 0.8);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.01, z + 2.3);
  scene.add(mesh);
}

// --- Workshop structure ---
function buildWorkshop() {
  // Back wall
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x0d1525, roughness: 0.95 });
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(28, 5, 0.3), wallMat);
  backWall.position.set(0, 2.5, -8);
  backWall.receiveShadow = true;
  scene.add(backWall);

  // Side walls
  [-14, 14].forEach(x => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 16), wallMat);
    wall.position.set(x, 2.5, 0);
    wall.receiveShadow = true;
    scene.add(wall);
  });

  // Ceiling beams
  for (let z = -6; z <= 6; z += 4) {
    const beam = new THREE.Mesh(
      new THREE.BoxGeometry(28, 0.2, 0.3),
      new THREE.MeshStandardMaterial({ color: 0x0a1020 })
    );
    beam.position.set(0, 4.8, z);
    scene.add(beam);
  }

  // Shop lights hanging from ceiling
  [-8, -4, 0, 4, 8].forEach(x => {
    const lightGeo = new THREE.BoxGeometry(1.2, 0.08, 0.3);
    const lightMat = new THREE.MeshStandardMaterial({
      color: 0xaaddff,
      emissive: 0x4499cc,
      emissiveIntensity: 0.8
    });
    const light = new THREE.Mesh(lightGeo, lightMat);
    light.position.set(x, 4.6, -2);
    scene.add(light);

    const pLight = new THREE.PointLight(0x6699cc, 0.5, 8);
    pLight.position.set(x, 4.4, -2);
    scene.add(pLight);
  });

  // Tool bench (back wall)
  const benchMat = new THREE.MeshStandardMaterial({ color: 0x1a2a3a, roughness: 0.8 });
  const bench = new THREE.Mesh(new THREE.BoxGeometry(26, 0.8, 1.2), benchMat);
  bench.position.set(0, 0.9, -7.2);
  bench.castShadow = true;
  bench.receiveShadow = true;
  scene.add(bench);

  // Reception area indicator
  const receptionGeo = new THREE.PlaneGeometry(5, 2);
  const receptionMat = new THREE.MeshStandardMaterial({
    color: 0x102030,
    roughness: 1
  });
  const reception = new THREE.Mesh(receptionGeo, receptionMat);
  reception.rotation.x = -Math.PI / 2;
  reception.position.set(0, 0.005, 7.5);
  scene.add(reception);
}

// --- Slot positioning (4 columns x 2 rows) ---
function getSlotPos(slot) {
  const cols = [-4.5, -1.5, 1.5, 4.5];
  const rows = [-4, -0.5];
  const col = (slot - 1) % 4;
  const row = Math.floor((slot - 1) / 4);
  return { x: cols[col], z: rows[row] };
}

// --- Build/update car meshes ---
function buildCars(data) {
  // Remove old cars
  Object.values(carMeshes).forEach(group => scene.remove(group));
  carMeshes = {};

  if (!data || !data.orders) return;

  data.orders.forEach(order => {
    const mesh = createCarMesh(order);
    scene.add(mesh);
    carMeshes[order.id] = mesh;
  });
}

function createCarMesh(order) {
  const color = STATUS_COLORS[order.status] || 0x4a9eff;
  const { x, z } = getSlotPos(order.slot);

  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.userData = { orderId: order.id };

  // Car body
  const bodyMat = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.3,
    metalness: 0.7,
    emissive: color,
    emissiveIntensity: 0.1
  });

  // Main body
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 3.6), bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  group.add(body);

  // Cabin
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.55, 1.8), bodyMat);
  cabin.position.set(0, 1.07, -0.1);
  cabin.castShadow = true;
  group.add(cabin);

  // Windows
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x88aacc,
    roughness: 0.1,
    metalness: 0.1,
    transparent: true,
    opacity: 0.6
  });
  const frontWindow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.42), glassMat);
  frontWindow.position.set(0, 1.1, 0.78);
  frontWindow.rotation.x = -0.3;
  group.add(frontWindow);

  const rearWindow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.42), glassMat);
  rearWindow.position.set(0, 1.1, -0.98);
  rearWindow.rotation.x = 0.3;
  group.add(rearWindow);

  // Wheels
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.8, roughness: 0.3 });
  [[0.9, 0.3, 1.2], [-0.9, 0.3, 1.2], [0.9, 0.3, -1.2], [-0.9, 0.3, -1.2]].forEach(([wx, wy, wz]) => {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(wx, wy, wz);
    wheel.castShadow = true;
    group.add(wheel);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.21, 8), rimMat);
    rim.rotation.z = Math.PI / 2;
    rim.position.set(wx, wy, wz);
    group.add(rim);
  });

  // Status glow ring on floor
  const ringGeo = new THREE.RingGeometry(0.9, 1.1, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.4,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  group.add(ring);

  // Plate label above car
  const plateCanvas = document.createElement('canvas');
  plateCanvas.width = 256; plateCanvas.height = 64;
  const ctx = plateCanvas.getContext('2d');
  ctx.fillStyle = 'rgba(10,14,26,0.9)';
  ctx.roundRect(4, 8, 248, 48, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(order.plate, 128, 32);
  const plateTex = new THREE.CanvasTexture(plateCanvas);
  const plateMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1.6, 0.4),
    new THREE.MeshBasicMaterial({ map: plateTex, transparent: true })
  );
  plateMesh.position.set(0, 2.0, 0);
  plateMesh.userData.isLabel = true;
  group.add(plateMesh);

  // Progress bar floating above
  if (order.progress > 0 && order.progress < 100) {
    const bgBar = new THREE.Mesh(
      new THREE.PlaneGeometry(1.5, 0.08),
      new THREE.MeshBasicMaterial({ color: 0x1a2a44 })
    );
    bgBar.position.set(0, 2.45, 0);
    group.add(bgBar);

    const fillBar = new THREE.Mesh(
      new THREE.PlaneGeometry(1.5 * (order.progress / 100), 0.08),
      new THREE.MeshBasicMaterial({ color })
    );
    fillBar.position.set(-0.75 + (1.5 * (order.progress / 100)) / 2, 2.45, 0.001);
    group.add(fillBar);
  }

  return group;
}

// --- Raycasting ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function getOrderFromIntersect(event) {
  const container = document.getElementById('canvas-container');
  const rect = container.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const objs = [];
  Object.values(carMeshes).forEach(g => g.traverse(c => { if (c.isMesh) objs.push(c); }));
  const hits = raycaster.intersectObjects(objs);
  if (!hits.length) return null;

  let obj = hits[0].object;
  while (obj && !obj.userData.orderId) obj = obj.parent;
  if (!obj) return null;

  return allData?.orders.find(o => o.id === obj.userData.orderId) || null;
}

function onMouseMove(e) {
  const order = getOrderFromIntersect(e);
  const tooltip = document.getElementById('tooltip');
  if (order) {
    document.body.style.cursor = 'pointer';
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    document.getElementById('tt-plate').textContent = order.plate;
    document.getElementById('tt-service').textContent = order.model + ' — ' + order.service;
    document.getElementById('tt-status').innerHTML = `
      <span style="color:${statusColor(order.status)}">${STATUS_LABELS[order.status] || order.status}</span>
      &nbsp;•&nbsp; ${order.progress}% &nbsp;•&nbsp; R$ ${order.value.toLocaleString('pt-BR')}
    `;
  } else {
    document.body.style.cursor = 'default';
    tooltip.style.display = 'none';
  }
}

function onClick(e) {
  const order = getOrderFromIntersect(e);
  if (order) selectOrder(order.id);
}

function statusColor(status) {
  const map = {
    em_andamento: '#4a9eff',
    aguardando_peca: '#ffc94a',
    concluido: '#4aff9e',
    diagnostico: '#ff7c4a'
  };
  return map[status] || '#fff';
}

// --- Panel & selection ---
function selectOrder(id) {
  selectedOrder = id;
  renderPanel();
  // Animate selected car
  if (carMeshes[id]) {
    const mesh = carMeshes[id];
    animatePop(mesh);
  }
}

function animatePop(mesh) {
  const startY = mesh.position.y;
  const targetY = 0.3;
  let t = 0;
  const up = setInterval(() => {
    t += 0.08;
    mesh.position.y = startY + Math.sin(t * Math.PI) * targetY;
    if (t >= 1) {
      mesh.position.y = startY;
      clearInterval(up);
    }
  }, 16);
}

function renderPanel() {
  if (!allData) return;
  const list = document.getElementById('orders-list');
  list.innerHTML = '';

  allData.orders.forEach(order => {
    const card = document.createElement('div');
    card.className = 'order-card' + (order.id === selectedOrder ? ' selected' : '');
    card.innerHTML = `
      <div class="order-header">
        <div class="order-plate">${order.plate}</div>
        <div class="status-badge status-${order.status}">${STATUS_LABELS[order.status] || order.status}</div>
      </div>
      <div class="order-model">${order.model} &bull; Vaga ${order.slot} &bull; ${order.mechanic}</div>
      <div class="order-service">${order.service}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${order.progress}%"></div></div>
      <div class="order-meta">
        <span>OS ${order.id}</span>
        <span class="order-value">R$ ${order.value.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
      </div>
      ${order.id === selectedOrder ? renderParts(order) : ''}
    `;
    card.addEventListener('click', () => selectOrder(order.id));
    list.appendChild(card);
  });
}

function renderParts(order) {
  if (!order.parts || !order.parts.length) return '';
  return `
    <div class="parts-list">
      ${order.parts.map(p => {
        const stockClass = p.stock === 0 ? 'stock-zero' : p.stock <= 1 ? 'stock-low' : 'stock-ok';
        return `
          <div class="part-item">
            <span class="part-name">${p.name} ×${p.qty}</span>
            <span class="part-type type-${p.type}">${p.type}</span>
            <span class="part-stock ${stockClass}">est: ${p.stock}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function updateStats(data) {
  if (!data?.stats) return;
  document.getElementById('stat-em_andamento').textContent = data.stats.inProgress || 0;
  document.getElementById('stat-aguardando_peca').textContent = data.stats.waitingParts || 0;
  document.getElementById('stat-concluido').textContent = data.stats.completed || 0;
  document.getElementById('stat-diagnostico').textContent = data.stats.diagnostic || 0;
  document.getElementById('stat-revenue').textContent =
    'R$ ' + (data.stats.totalRevenue || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
}

// --- WebSocket ---
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${location.host}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'connected' || msg.type === 'update') {
      allData = msg.data;
      buildCars(allData);
      updateStats(allData);
      renderPanel();
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

// --- Labels always face camera ---
function updateLabels() {
  Object.values(carMeshes).forEach(group => {
    group.traverse(child => {
      if (child.userData.isLabel) {
        child.lookAt(camera.position);
      }
    });
  });
}

// --- Animate ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateLabels();

  // Idle rotation on cars
  const t = Date.now() * 0.001;
  Object.values(carMeshes).forEach((group, i) => {
    if (group.position.y > 0.01) return;
    group.rotation.y = Math.sin(t * 0.3 + i * 0.8) * 0.03;
  });

  renderer.render(scene, camera);
}

function onResize() {
  const container = document.getElementById('canvas-container');
  const W = container.clientWidth;
  const H = container.clientHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
}

// --- Start ---
initThree();
connectWS();
</script>
</body>
</html>
